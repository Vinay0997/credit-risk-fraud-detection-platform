[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-fraud-platform"
version = "0.1.0"
description = "Credit risk, fraud detection, explainability, monitoring, and regulatory RAG assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "gradio>=4.44",
]

[project.optional-dependencies]
full = [
    "xgboost>=2.0",
    "shap>=0.44",
    "torch>=2.2",
    "pyspark>=3.5",
    "evidently>=0.4",
    "mlflow>=2.10",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "faiss-cpu>=1.8",
    "gradio>=4.44",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
